version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mtk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtk}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotik_manager}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtk} -d ${POSTGRES_DB:-mikrotik_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mtk_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: mtk_api
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mtk}:${POSTGRES_PASSWORD:-mtk}@postgres:5432/${POSTGRES_DB:-mikrotik_manager}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: mtk_worker
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mtk}:${POSTGRES_PASSWORD:-mtk}@postgres:5432/${POSTGRES_DB:-mikrotik_manager}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Leave VITE_API_URL unset: the frontend detects the API host at
      # runtime from the page's own address. Uncomment and set only if the
      # API is on a different host/port (e.g. behind a reverse proxy):
      # args:
      #   VITE_API_URL: https://api.example.com
    container_name: mtk_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  adminer:
    image: adminer:latest
    container_name: mtk_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
